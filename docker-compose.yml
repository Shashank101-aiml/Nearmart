version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - redis
      - rabbitmq
    networks:
      - buildit-net

  client:
    build:
      context: ./client
    ports:
      - "5173:5173"
    networks:
      - buildit-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - buildit-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - buildit-net

networks:
  buildit-net:
    driver: bridge
