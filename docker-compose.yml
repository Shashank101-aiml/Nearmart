services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=buildit
      - DB_USER=buildit
      - DB_PASS=builditpass
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - buildit-net

  client:
    build:
      context: ./client
    ports:
      - "5173:5173"
    networks:
      - buildit-net

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=buildit
      - POSTGRES_USER=buildit
      - POSTGRES_PASSWORD=builditpass
    ports:
      - "5433:5432" # host 5433: avoids clashing with a locally-installed Postgres on 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildit -d buildit"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - buildit-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - buildit-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - buildit-net

networks:
  buildit-net:
    driver: bridge

volumes:
  postgres-data:
